kind = "web"
previewPath = "/"
title = "Portal Oráculo de SophIA"
version = "1.0.0"
id = "artifacts/portal-sophia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24691

[services.development]
run = "pnpm --filter @workspace/portal-sophia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portal-sophia", "run", "build" ]
publicDir = "artifacts/portal-sophia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24691"
BASE_PATH = "/"
